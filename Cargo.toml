[package]
name = "asr-lso"
version = "0.1.0"
edition = "2021"
description = "AutoSplitter Runtime bridge for LiveSplit one"

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.4.6", default-features = false, features = [
    "derive",
    "help",
    "std",
    "usage",
] }
indexmap = "2.0.0"
livesplit-core = { git = "https://github.com/LiveSplit/livesplit-core", default-features = false, features = [
    "std",
] }
livesplit-auto-splitting = { git = "https://github.com/LiveSplit/livesplit-core" }
time = { version = "0.3.36", features = ["local-offset"] }
tungstenite = { version = "0.26.2", features = ["rustls"] }
serde_json = "1.0.140"

[profile.max-opt]
inherits = "release"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.max-opt.build-override]
opt-level = 0
